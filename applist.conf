# 【自动规则生成工具-自定义模板配置区】
# 说明：此处配置自动规则生成工具的规则模板，修改此处无需重新刷入模块，直接运行生成工具即可生效
# 主程序会自动忽略所有#开头的注释行，此处配置完全不影响下方现有规则的正常生效
# ==============================================
# 【使用必读说明】
# 1. 每个模板用固定标记包裹：# ==== 模板名称 开始 ==== 和 # ==== 模板名称 结束 ====，请勿修改/删除包裹标记
# 2. 模板内 {{PKG_NAME}} = 包名占位符，{{APP_NAME}} = 备注名占位符，请勿删除/修改这两个占位符，否则生成会失效
# 3. 规则行格式完全兼容原生格式：{{PKG_NAME}}{线程匹配规则}=核心编号范围，和你现有生效规则写法完全一致
# 4. 自由操作：可新增规则行、删除不需要的行、修改核心绑定范围、调整注释说明，修改后保存文件即可生效
# 5. 容错兜底：若模板配置错误/格式损坏，工具会自动使用默认模板兜底，保证正常运行
# 6. 注意：仅修改模板内的规则行，不要改动包裹标记和占位符，否则会导致读取失败
# ==============================================

